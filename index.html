<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b15">
  <title>VeronixKyzooxd — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;font-family:Arial,sans-serif;color:#f8fafc;
      background:radial-gradient(ellipse at top,#19294a,#080b15 65%);
    }
    .card{
      width:100%;max-width:420px;padding:30px;border:1px solid #28344c;
      border-radius:22px;background:#101727ef;box-shadow:0 25px 80px #0008;
    }
    .logo{
      width:62px;height:62px;display:grid;place-items:center;margin:0 auto 18px;
      border-radius:18px;background:linear-gradient(135deg,#60a5fa,#6366f1);
      font-size:25px;font-weight:900;color:white;
    }
    h1{text-align:center;font-size:25px;margin-bottom:8px}
    .sub{text-align:center;color:#9caac0;font-size:13px;margin-bottom:26px}
    label{display:block;font-size:13px;margin:15px 0 8px;color:#d5deed}
    input{
      width:100%;padding:13px 14px;border:1px solid #334155;border-radius:11px;
      background:#0a1020;color:white;outline:none;font-size:14px;
    }
    input:focus{border-color:#60a5fa}
    button{
      width:100%;padding:14px;margin-top:22px;border:0;border-radius:11px;
      background:linear-gradient(110deg,#3b82f6,#6366f1);
      color:white;font-weight:700;font-size:14px;cursor:pointer;
    }
    button:disabled{opacity:.6;cursor:wait}
    #status{margin-top:16px;font-size:13px;line-height:1.6;text-align:center}
    .hint{margin-top:20px;text-align:center;color:#8391a8;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">VK</div>
    <h1>VeronixKyzooxd</h1>
    <p class="sub">Masuk ke akun dashboard kamu</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username"
        placeholder="Masukkan username" required maxlength="100">

      <label for="accountKey">Account Key</label>
      <input id="accountKey" type="password"
        autocomplete="current-password"
        placeholder="Masukkan account key" required maxlength="500">

      <button id="loginButton" type="submit">Masuk Dashboard</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">Verifikasi akun melalui backend yang terhubung ke GitHub.</p>
  </main>

<script>
"use strict";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const statusEl = document.getElementById("status");

form.addEventListener("submit", async event => {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const accountKey = document.getElementById("accountKey").value;

  if (!username || !accountKey) {
    statusEl.textContent = "Username dan Account Key wajib diisi.";
    statusEl.style.color = "#fca5a5";
    return;
  }

  button.disabled = true;
  statusEl.textContent = "Memeriksa akun...";
  statusEl.style.color = "#cbd5e1";

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, accountKey })
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(result.error || "Login gagal.");
    }

    // Backend menyetel cookie HttpOnly.
    // Jangan menyimpan role atau sesi tepercaya di sessionStorage.
    window.location.replace("kyzo.html");
  } catch (error) {
    statusEl.textContent = error.message || "Terjadi kesalahan saat login.";
    statusEl.style.color = "#fca5a5";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
