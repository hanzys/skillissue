<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020711"><title>VeronixKyzooxd — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,sans-serif;color:#fff;background:radial-gradient(circle at 50% -10%,rgba(0,132,255,.24),transparent 32%),radial-gradient(circle at 100% 40%,rgba(0,105,255,.14),transparent 30%),linear-gradient(180deg,#020711,#030b16 50%,#020812);overflow-x:hidden;position:relative}body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none}body:before{width:760px;height:760px;right:-310px;top:-410px;border:1px solid rgba(18,145,255,.3);background:radial-gradient(circle at 35% 65%,rgba(0,133,255,.15),transparent 68%)}body:after{width:620px;height:620px;left:-400px;bottom:-380px;border:1px solid rgba(14,131,255,.22);background:radial-gradient(circle at 65% 45%,rgba(0,117,255,.1),transparent 68%)}.login-wrap{width:100%;max-width:470px;position:relative;z-index:2}.brand{text-align:center;margin-bottom:24px}.title{font-size:34px;font-weight:700;letter-spacing:-1.5px}.title span{color:#159fff}.subtitle{margin-top:8px;color:#7690b1;font-size:13px}.card{padding:32px;border:1px solid rgba(0,142,255,.42);border-radius:24px;background:linear-gradient(145deg,rgba(3,13,25,.88),rgba(2,9,18,.95));box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(0,104,255,.08),inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(24px)}.icon{width:58px;height:58px;margin:0 auto 18px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(0,153,255,.12);border:1px solid rgba(21,159,255,.3);box-shadow:0 0 28px rgba(0,144,255,.12);font-size:27px}.heading{text-align:center;font-size:21px;font-weight:600}.desc{text-align:center;margin:8px auto 25px;max-width:350px;color:#7892b0;font-size:12px;line-height:1.6}.field{margin-top:15px}.label{display:block;margin-bottom:9px;font-size:13px;color:#dce8f7}.input-wrap{position:relative}.input-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:18px;color:#7da1cb;z-index:2}.input{width:100%;height:52px;padding:0 48px 0 50px;border:1px solid #294d72;border-radius:12px;outline:0;background:linear-gradient(145deg,rgba(14,34,57,.86),rgba(7,21,37,.9));color:#fff;font:inherit;font-size:13px}.input::placeholder{color:#7188a5}.input:focus{border-color:#148eff;box-shadow:0 0 0 2px rgba(0,134,255,.08),0 0 25px rgba(0,119,255,.08)}.eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#7892b0;cursor:pointer;font-size:16px}.button{width:100%;height:52px;margin-top:20px;border:0;border-radius:12px;color:#fff;font:600 14px Inter,sans-serif;cursor:pointer;background:linear-gradient(100deg,#22c4ed,#159cf7 46%,#235eff);box-shadow:0 8px 25px rgba(0,128,255,.24),inset 0 1px 0 rgba(255,255,255,.28);transition:.2s}.button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,128,255,.31)}.button:disabled{opacity:.55;cursor:not-allowed;transform:none}.status{min-height:38px;margin-top:14px;padding:10px 12px;border-radius:10px;border:1px solid rgba(43,101,159,.3);background:rgba(4,16,30,.58);font-size:11px;color:#159fff;line-height:1.6;overflow-wrap:anywhere}.status.error{color:#ff6375;border-color:rgba(255,99,117,.3)}.status.success{color:#2ee9a4;border-color:rgba(46,233,164,.3)}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.role{padding:10px 5px;text-align:center;border:1px solid rgba(43,86,127,.2);border-radius:10px;background:rgba(4,15,28,.5);font-size:9px;color:#7892b0}.role strong{display:block;margin-bottom:4px;font-size:10px;color:#dcecff}.footer{text-align:center;margin-top:18px;color:#526c8b;font-size:9px;letter-spacing:2px}@media(max-width:480px){.card{padding:24px 18px}.title{font-size:28px}.roles{grid-template-columns:1fr}.role{padding:8px}}
</style></head><body><div class="login-wrap"><div class="brand"><div class="title">Veronix<span>Kyzooxd</span></div><div class="subtitle">Secure Token Manager</div></div><div class="card"><div class="icon">♛</div><div class="heading">Masuk ke Dashboard</div><div class="desc">Masukkan nama akun dan password yang terdaftar pada database role GitHub.</div><form id="loginForm"><div class="field"><label class="label" for="username">Nama Akun</label><div class="input-wrap"><div class="input-icon">♙</div><input id="username" class="input" type="text" placeholder="Masukkan nama akun..." autocomplete="username" required></div></div><div class="field"><label class="label" for="password">Password</label><div class="input-wrap"><div class="input-icon">🔒</div><input id="password" class="input" type="password" placeholder="Masukkan password..." autocomplete="current-password" required><button id="eye" class="eye" type="button" aria-label="Tampilkan password">◉</button></div></div><button id="loginButton" class="button" type="submit">Masuk Dashboard</button></form><div id="status" class="status" role="status" aria-live="polite">Menunggu nama akun dan password.</div><div class="roles"><div class="role"><strong>RESELLER</strong>Limit 7 token</div><div class="role"><strong>CEO</strong>Limit 13 token</div><div class="role"><strong>DEVELOPER</strong>Akses penuh</div></div></div><div class="footer">VERONIXKYZOOXD © 2026</div></div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script>
"use strict";
/* Gunakan repo dan path yang sama dengan dashboard.html. */
const GITHUB_OWNER="hanzys";
const GITHUB_REPO="database";
const GITHUB_BRANCH="main";
const ROLE_PATH="databasekode/role.json";
const ROLE_RAW_URL=`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${ROLE_PATH}`;
const username=document.getElementById("username"),password=document.getElementById("password"),form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),statusBox=document.getElementById("status"),eye=document.getElementById("eye");
try{const saved=JSON.parse(localStorage.getItem("veronix_current_account")||"null");if(saved&&saved.username&&saved.role)window.location.replace("dashboard.html");}catch(e){localStorage.removeItem("veronix_current_account");}
function setStatus(message,type=""){statusBox.textContent=message;statusBox.className="status "+type;}
async function getRoleDatabase(){const response=await axios.get(ROLE_RAW_URL+"?t="+Date.now(),{timeout:15000,headers:{Accept:"application/json"}});const data=response.data;if(!data||typeof data!=="object")throw new Error("Isi role.json tidak valid.");for(const role of ["developer","ceo","reseller"]){if(!Array.isArray(data[role]))data[role]=[];}return data;}
async function login(){const user=username.value.trim(),pass=password.value;if(!user||!pass){setStatus("Nama akun dan password wajib diisi.","error");return;}button.disabled=true;button.textContent="Memeriksa...";setStatus("Memeriksa akun di GitHub...");try{const db=await getRoleDatabase();let account=null,roleFound="";for(const role of ["developer","ceo","reseller"]){const found=db[role].find(item=>String(item.username||"").trim().toLowerCase()===user.toLowerCase()&&String(item.password||"")===pass);if(found){account=found;roleFound=role;break;}}if(!account){setStatus("Nama akun atau password salah, atau akun belum terdaftar.","error");return;}const role=String(account.role||roleFound).trim().toLowerCase();if(!["developer","ceo","reseller"].includes(role)){setStatus("Role akun tidak valid.","error");return;}const tokenLimit=role==="developer"?999999:Number(account.tokenLimit||(role==="ceo"?(db.settings?.ceoTokenLimit||13):(db.settings?.resellerTokenLimit||7)));const resellerLimit=role==="developer"?999999:role==="ceo"?Number(account.resellerLimit||(db.settings?.maxResellerPerCeo||3)):0;const session={username:account.username,role,password:pass,tokenLimit,resellerLimit,createdBy:account.createdBy||null,createdAt:account.createdAt||null,loginAt:new Date().toISOString()};localStorage.setItem("veronix_current_account",JSON.stringify(session));setStatus(`Login berhasil. Role: ${role.toUpperCase()}. Mengalihkan...`,"success");window.setTimeout(()=>window.location.replace("dashboard.html"),500);}catch(error){console.error(error);if(error.response?.status===404)setStatus("role.json tidak ditemukan. Periksa repository, branch, dan path.","error");else if(error.response)setStatus("GitHub mengembalikan error HTTP "+error.response.status+".","error");else setStatus("Gagal membaca role.json. Periksa koneksi internet dan format file.","error");}finally{button.disabled=false;button.textContent="Masuk Dashboard";}}
eye.addEventListener("click",()=>{const show=password.type==="password";password.type=show?"text":"password";eye.textContent=show?"◌":"◉";eye.setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password");});form.addEventListener("submit",event=>{event.preventDefault();login();});
</script></body></html>
